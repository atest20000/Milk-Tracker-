<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Milk Delivery Tracker</title>
    
    <!-- Direct Vector PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2, h3 { text-align: center; color: var(--primary-color); margin-top: 0; }
        
        .top-summary-box {
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #166534;
        }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input[type="date"], input[type="number"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-qty {
            padding: 12px 6px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .btn-qty.active { background: var(--primary-color); color: white; }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        hr { border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0; }
        
        .table-container {
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
        th, td { border: 1px solid #d1d5db; padding: 10px 8px; text-align: center; }
        th { background-color: var(--primary-color); color: white; }
        
        .action-btn { padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; color: white; border: none; }
        .edit-btn { background: #3b82f6; margin-right: 4px; }
        .delete-btn { background: #ef4444; }
        
        .btn-pdf-action { 
            background: #d97706; 
            margin-top: 15px; 
        }

        /* MODAL POPUP STYLING */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #d1d5db;
            background: white;
            color: var(--text-color);
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            text-align: center;
        }
        .modal-btn:hover { background: #f3f4f6; }
        .modal-btn-primary {
            background: #2563eb;
            color: white;
            border: none;
        }
        .modal-btn-cancel {
            background: transparent;
            border: none;
            color: #dc2626;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🥛 Milk Delivery Tracker</h2>
    
    <!-- Top Summary Card -->
    <div id="topSummaryContainer" class="top-summary-box">
        Total Milk: 0.0 Liters<br>
        Total to Pay: ₹0.00
    </div>

    <div>
        <h3>Add or Update Entry</h3>
        <div class="form-group">
            <label for="entryDate">Date:</label>
            <input type="date" id="entryDate" onchange="checkDateEntry()">
        </div>

        <div class="form-group">
            <label>Select Quantity:</label>
            <div class="quick-buttons">
                <button type="button" class="btn-qty" id="btn-0" onclick="setQuantity(0)">0 Liter</button>
                <button type="button" class="btn-qty" id="btn-1" onclick="setQuantity(1)">1 Liter</button>
                <button type="button" class="btn-qty active" id="btn-1.5" onclick="setQuantity(1.5)">1.5 Liter</button>
                <button type="button" class="btn-qty" id="btn-2" onclick="setQuantity(2)">2 Liters</button>
            </div>
            <input type="number" id="customQty" step="0.1" placeholder="Or custom liters..." oninput="clearActiveButtons()">
        </div>

        <!-- Default Rate Box Before Save -->
        <div class="form-group">
            <label for="entryRate">Rate (₹/Liter):</label>
            <input type="number" id="entryRate" step="0.5" min="1">
        </div>

        <button class="btn-primary" onclick="saveEntry()">Save Entry</button>
    </div>

    <hr>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:12px;">
        <div>
            <label for="startDate">From:</label>
            <input type="date" id="startDate" onchange="loadReport()">
        </div>
        <div>
            <label for="endDate">To:</label>
            <input type="date" id="endDate" onchange="loadReport()">
        </div>
    </div>

    <div class="table-container" id="tableContainer"></div>

    <button class="btn-primary btn-pdf-action" onclick="openExportModal()">Export PDF</button>
</div>

<!-- RANGE SELECTION MODAL POPUP -->
<div id="exportModal" class="modal-overlay">
    <div class="modal-content">
        <h3 style="text-align:center; margin-bottom:15px; color:#1f2937;">Select PDF Export Range</h3>
        <button class="modal-btn" onclick="generatePdf('all')">All Time Data</button>
        <button class="modal-btn" onclick="generatePdf('1month')">Last 1 Month</button>
        <button class="modal-btn" onclick="generatePdf('1year')">Last 1 Year</button>
        
        <div style="border-top: 1px solid #e5e7eb; margin: 15px 0; padding-top: 10px;">
            <label style="font-size:13px; margin-bottom:4px;">Custom Date Range:</label>
            <input type="date" id="modalStartDate" style="margin-bottom:8px; padding:8px; font-size:14px; width:100%; box-sizing:border-box; border:1px solid #d1d5db; border-radius:6px;">
            <input type="date" id="modalEndDate" style="margin-bottom:10px; padding:8px; font-size:14px; width:100%; box-sizing:border-box; border:1px solid #d1d5db; border-radius:6px;">
            <button class="modal-btn modal-btn-primary" onclick="generatePdf('custom')">Export Custom Range</button>
        </div>
        <button class="modal-btn modal-btn-cancel" onclick="closeExportModal()">Cancel</button>
    </div>
</div>

<script>
    let persistentRate = parseFloat(localStorage.getItem('milk_rate')) || 48;
    document.getElementById('entryRate').value = persistentRate;

    const DEFAULT_QTY = 1.5;
    let selectedQty = 1.5;

    // Helper function to format YYYY-MM-DD to DD-MM-YYYY
    function formatDateDDMMYYYY(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length === 3) {
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
        return dateStr;
    }

    window.onload = function() {
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        document.getElementById('entryDate').value = todayStr; // Always default entry selector to today's date
        
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
        const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().split('T')[0];
        
        document.getElementById('startDate').value = firstDay;
        document.getElementById('endDate').value = lastDay;

        autoPopulateMonth(today.getFullYear(), today.getMonth());
        checkDateEntry();
        loadReport();
    };

    function autoPopulateMonth(year, month) {
        let entries = getEntries();
        const today = new Date();
        const lastDayNum = (year === today.getFullYear() && month === today.getMonth()) ? today.getDate() : new Date(year, month + 1, 0).getDate();

        let added = false;
        for (let day = 1; day <= lastDayNum; day++) {
            const dayStr = String(day).padStart(2, '0');
            const monthStr = String(month + 1).padStart(2, '0');
            const dateStr = `${year}-${monthStr}-${dayStr}`;

            const exists = entries.some(e => e.date === dateStr);
            if (!exists) {
                entries.push({ date: dateStr, qty: DEFAULT_QTY, rate: persistentRate, total: DEFAULT_QTY * persistentRate });
                added = true;
            }
        }
        if (added) {
            entries.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('milk_entries', JSON.stringify(entries));
        }
    }

    function setQuantity(qty) {
        selectedQty = qty;
        document.getElementById('customQty').value = qty;
        document.querySelectorAll('.btn-qty').forEach(btn => btn.classList.remove('active'));
        const targetBtn = document.getElementById('btn-' + qty);
        if (targetBtn) targetBtn.classList.add('active');
    }

    function clearActiveButtons() {
        selectedQty = null;
        document.querySelectorAll('.btn-qty').forEach(btn => btn.classList.remove('active'));
    }

    function getEntries() {
        let entries = localStorage.getItem('milk_entries');
        return entries ? JSON.parse(entries) : [];
    }

    function checkDateEntry() {
        const date = document.getElementById('entryDate').value;
        const entries = getEntries();
        const found = entries.find(e => e.date === date);
        if (found !== undefined) {
            setQuantity(found.qty);
            document.getElementById('entryRate').value = found.rate !== undefined ? found.rate : persistentRate;
        } else {
            setQuantity(1.5);
            document.getElementById('entryRate').value = persistentRate;
        }
    }

    function saveEntry() {
        const date = document.getElementById('entryDate').value;
        const customInput = parseFloat(document.getElementById('customQty').value);
        const qty = (selectedQty !== null && !isNaN(selectedQty)) ? selectedQty : customInput;
        const rateInput = parseFloat(document.getElementById('entryRate').value);
        
        if (!date) { alert('Please select a date.'); return; }
        if (isNaN(qty) || qty < 0) { alert('Please enter a valid quantity.'); return; }
        if (isNaN(rateInput) || rateInput <= 0) { alert('Please enter a valid rate.'); return; }

        // Update persistent default rate to whatever was manually typed/saved
        persistentRate = rateInput;
        localStorage.setItem('milk_rate', persistentRate);

        let entries = getEntries();
        const existingIndex = entries.findIndex(e => e.date === date);
        
        if (existingIndex >= 0) {
            entries[existingIndex].qty = qty;
            entries[existingIndex].rate = persistentRate;
            entries[existingIndex].total = qty * persistentRate;
        } else {
            entries.push({ date: date, qty: qty, rate: persistentRate, total: qty * persistentRate });
        }

        entries.sort((a, b) => new Date(a.date) - new Date(b.date));
        localStorage.setItem('milk_entries', JSON.stringify(entries));
        loadReport();
        
        // Reset entry date back to today's date after saving
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('entryDate').value = todayStr;
        checkDateEntry();
    }

    function editEntry(date, qty, rate) {
        document.getElementById('entryDate').value = date;
        setQuantity(qty);
        document.getElementById('entryRate').value = rate !== undefined ? rate : persistentRate;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEntry(date) {
        if (confirm('Delete entry for ' + formatDateDDMMYYYY(date) + '?')) {
            let entries = getEntries().filter(e => e.date !== date);
            localStorage.setItem('milk_entries', JSON.stringify(entries));
            checkDateEntry();
            loadReport();
        }
    }

    function loadReport() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const entries = getEntries();

        const filtered = entries.filter(e => (!startDate || e.date >= startDate) && (!endDate || e.date <= endDate));

        let totalLiters = 0, totalAmount = 0;
        filtered.forEach(e => {
            totalLiters += parseFloat(e.qty);
            totalAmount += parseFloat(e.total);
        });

        document.getElementById('topSummaryContainer').innerHTML = `Total Milk: ${totalLiters.toFixed(1)} Liters<br>Total to Pay: ₹${totalAmount.toFixed(2)}`;

        let html = `<table><thead><tr><th>Date</th><th>Qty</th><th>Amount</th><th>Action</th></tr></thead><tbody>`;
        if (filtered.length === 0) {
            html += `<tr><td colspan="4">No entries found for this range.</td></tr>`;
        } else {
            filtered.forEach(e => {
                const rVal = e.rate !== undefined ? e.rate : persistentRate;
                html += `<tr>
                    <td>${formatDateDDMMYYYY(e.date)}</td>
                    <td>${e.qty}L</td>
                    <td>₹${e.total.toFixed(2)}</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="editEntry('${e.date}', ${e.qty}, ${rVal})">Edit</button>
                        <button class="action-btn delete-btn" onclick="deleteEntry('${e.date}')">X</button>
                    </td>
                </tr>`;
            });
        }
        html += `</tbody></table>`;
        document.getElementById('tableContainer').innerHTML = html;
    }

    function openExportModal() {
        document.getElementById('modalStartDate').value = document.getElementById('startDate').value;
        document.getElementById('modalEndDate').value = document.getElementById('endDate').value;
        document.getElementById('exportModal').style.display = 'flex';
    }

    function closeExportModal() {
        document.getElementById('exportModal').style.display = 'none';
    }

    function generatePdf(filterType) {
        let startDate = '';
        let endDate = '';
        const now = new Date();

        if (filterType === '1month') {
            let d = new Date();
            d.setMonth(d.getMonth() - 1);
            startDate = d.toISOString().split('T')[0];
            endDate = now.toISOString().split('T')[0];
        } else if (filterType === '1year') {
            let d = new Date();
            d.setFullYear(d.getFullYear() - 1);
            startDate = d.toISOString().split('T')[0];
            endDate = now.toISOString().split('T')[0];
        } else if (filterType === 'custom') {
            startDate = document.getElementById('modalStartDate').value;
            endDate = document.getElementById('modalEndDate').value;
            if (!startDate || !endDate) { alert('Please select both start and end dates.'); return; }
        }

        closeExportModal();

        const entries = getEntries();
        const filtered = entries.filter(e => (!startDate || e.date >= startDate) && (!endDate || e.date <= endDate));

        if (filtered.length === 0) {
            alert("No records match the selected date range.");
            return;
        }

        let totLiters = 0, totAmount = 0;
        const tableRows = filtered.map(e => {
            totLiters += parseFloat(e.qty);
            totAmount += parseFloat(e.total);
            return [
                formatDateDDMMYYYY(e.date),
                e.qty + ' L',
                'Rs. ' + parseFloat(e.total).toFixed(2)
            ];
        });

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

        doc.setFontSize(18);
        doc.setTextColor(31, 41, 55);
        doc.text("Milk Delivery Report", 14, 20);

        doc.setFontSize(10);
        doc.setTextColor(107, 114, 128);
        doc.text(`Period: ${formatDateDDMMYYYY(startDate) || 'Beginning'} to ${formatDateDDMMYYYY(endDate) || 'Present'}`, 14, 26);

        doc.autoTable({
            startY: 32,
            head: [['Total Milk', 'Total Amount to Pay']],
            body: [[
                totLiters.toFixed(1) + ' Liters',
                'Rs. ' + totAmount.toFixed(2)
            ]],
            theme: 'grid',
            headStyles: { fillColor: [240, 253, 244], textColor: [22, 101, 52], fontStyle: 'bold' },
            bodyStyles: { fontStyle: 'bold', textColor: [22, 101, 52], halign: 'center' }
        });

        doc.autoTable({
            startY: doc.lastAutoTable.finalY + 10,
            head: [['Date', 'Quantity', 'Amount']],
            body: tableRows,
            theme: 'striped',
            headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255], fontStyle: 'bold' },
            styles: { fontSize: 10, cellPadding: 5, halign: 'center' }
        });

        doc.save(`Milk_Delivery_Report_${filterType}.pdf`);
    }
</script>

</body>
    </html>
